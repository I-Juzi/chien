server:
  port: 8080
  servlet:
    context-path: /admin

spring:
  application:
    name: chien-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/chien?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: txzk1688

  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10000ms

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.juzi.chien.admin.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,env

# JWT 配置
jwt:
  secret: chien-admin-secret-key-must-be-at-least-256-bits-long!!
  expiration: 86400000  # 24小时（毫秒）

# 日志配置
logging:
  level:
    com.juzi.chien.admin: debug

# SpringDoc / Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
